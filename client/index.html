<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciber Robotzin | Aventura Educativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="./vendor/phaser.min.js"></script>
    <style>
        :root {
            --sky-blue: #4FC3F7;
            --sky-blue-soft: #EAF6FF;
            --bright-orange: #FF8C00;
            --text-dark: #1B2A3A;
            color-scheme: light;
            font-family: 'Fredoka', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(145deg, var(--sky-blue-soft) 0%, #D7EEFF 50%, #FFF2E0 100%);
            color: var(--text-dark);
        }

        #game-container {
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            border-radius: 20px;
            overflow: hidden;
            border: 6px solid var(--bright-orange);
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.18);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <section id="game-container"></section>
    <script type="module" src="./js/scenes/game.js"></script>
</body>
</html>
